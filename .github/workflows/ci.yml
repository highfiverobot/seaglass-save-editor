name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Byte-compile sources
        run: python -m py_compile seaglass_inspect.py seaglass_write.py seaglass_editor.py theme.py

      - name: Headless smoke test (no sample data)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_test.py
